<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atemporal Strategy</title>
<style>
:root{color-scheme:dark;--bg:#1b1b1f;--panel:#26262c;--edge:#3a3a44;--text:#e8e8ec;--dim:#9a9aa6;--accent:#79d7ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:var(--text);background:#34343d;border:1px solid var(--edge);border-radius:4px;padding:.35rem .7rem;cursor:pointer}
button:hover{background:#40404a}button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--text);background:#141417;border:1px solid var(--edge);border-radius:4px;padding:.3rem .5rem}
#lobby{max-width:900px;margin:3rem auto;padding:0 1rem}
#lobby h1{margin:.2rem 0}
#lobby .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
#roster{list-style:none;padding:0;margin:.8rem 0;display:grid;gap:.4rem}
#roster li{display:flex;gap:.6rem;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:.5rem .7rem}
.swatch{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid #fff3;display:inline-block}
#rules{color:var(--dim);font-size:.9rem}
#status,#lobby-error{color:#ffb74d;min-height:1.2em}
#game{display:none;position:relative;width:100vw;height:100vh;overflow:hidden}
#game.active{display:block}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#top{position:absolute;left:0;right:0;top:0;height:2.1rem;display:flex;gap:1.2rem;align-items:center;padding:0 .8rem;background:#0008;font-size:.85rem;pointer-events:none}
#top span b{color:var(--accent)}
#panels{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:20rem 1fr 14rem;gap:.5rem;padding:.5rem;pointer-events:none}
#panels>div{background:#1e1e24e6;border:1px solid var(--edge);border-radius:6px;padding:.5rem;pointer-events:auto;height:15rem;overflow:auto;font-size:.82rem}
#selection h3,#draft-panel h3{margin:0 0 .3rem;font-size:.85rem;color:var(--dim);font-weight:600}
#timeline-wrap{display:flex;flex-direction:column;gap:.35rem}
#timeline{width:100%;height:5.2rem;display:block;background:#111114;border-radius:4px;cursor:pointer}
#transport{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
#transport button{padding:.2rem .5rem}
#minimap{width:7.5rem;height:7.5rem;display:block;background:#111114;border-radius:4px;cursor:pointer;float:right;margin-left:.4rem}
#draft-list{list-style:none;padding:0;margin:.3rem 0;display:grid;gap:.25rem}
#draft-list li{display:flex;justify-content:space-between;gap:.4rem;background:#2b2b33;border-radius:4px;padding:.2rem .4rem}
#draft-list li.selected{outline:1px solid var(--accent)}
#commit{width:100%;margin-top:.3rem;font-weight:700;padding:.5rem;background:#1f5f3a}
#commit:disabled{background:#333}
#mode{position:absolute;left:50%;top:2.4rem;pointer-events:none;transform:translateX(-50%);background:#000a;padding:.3rem .8rem;border-radius:4px;font-size:.85rem;display:none}
#mode.active{display:block}
#help{position:absolute;left:50%;transform:translateX(-50%);top:2.4rem;width:24rem;max-height:70vh;overflow:auto;background:#1e1e24f2;border:1px solid var(--edge);border-radius:6px;padding:.6rem .8rem;font-size:.8rem;display:none}
#help.active{display:block}
#help table{border-collapse:collapse}#help td{padding:.1rem .5rem .1rem 0;vertical-align:top}#help kbd{background:#333;border-radius:3px;padding:0 .3rem;font-family:monospace}
#result{position:absolute;right:.5rem;top:2.4rem;max-width:22rem;pointer-events:none;background:#1e1e24f2;border:1px solid var(--edge);border-radius:6px;padding:.5rem .7rem;font-size:.8rem}
#toast{position:absolute;left:50%;bottom:15.5rem;pointer-events:none;transform:translateX(-50%);background:#402a12;border:1px solid #a5682a;padding:.4rem .8rem;border-radius:4px;font-size:.85rem;display:none;max-width:40rem}
#toast.active{display:block}
.muted{color:var(--dim)}
#actions{display:flex;flex-wrap:wrap;gap:3px}#actions button{font-size:11px;padding:2px 5px}
#recipient{color:#ffda70;font-weight:600;margin-bottom:5px}#group-list,#queue{display:grid;gap:3px}#group-list button,#queue button{text-align:left;font-size:11px;padding:3px}
#lock-preview{color:#b8bbc8;font-size:11px;margin-top:8px}#replay{position:absolute;top:5rem;right:.5rem;max-width:25rem;max-height:55vh;overflow:auto;background:#1e1e24f5;border:1px solid var(--edge);border-radius:6px;padding:8px;font-size:12px}#replay[open]{z-index:4}#replay button{font-size:11px}#accepted-inputs>div{padding:5px 0;border-top:1px solid var(--edge)}#rewrite-summary{color:#ffda70;margin:8px 0}
.overlay{display:none;position:absolute;z-index:8;left:10%;top:10%;width:80%;max-height:75vh;overflow:auto;background:#202027;border:1px solid #666;padding:20px;border-radius:8px}.overlay.active{display:block}#graph{width:100%;height:auto}#statistics h2{margin:5px 0}#statistics p{font-size:12px}#close-stats{float:right}#stop-archive{position:absolute;right:.5rem;bottom:16rem;font-size:10px}#result{max-height:3rem;overflow:hidden}#result:hover{max-height:14rem;overflow:auto;pointer-events:auto}#top{height:auto;min-height:2.1rem;flex-wrap:wrap;gap:3px 12px;padding:4px 10px}#panels{grid-template-columns:20rem 1fr 18rem}#panels>div{height:17rem}#toast{bottom:18rem}#stop-archive{bottom:18rem}#mode{top:3rem;z-index:5}#help{z-index:9;width:30rem}#transport{gap:3px}#transport button{font-size:11px}#timeline-wrap{min-width:0}#timeline{flex-shrink:0}
@media(max-width:800px){#panels{grid-template-columns:1fr 1fr}#panels>div{height:12rem}#timeline-wrap{grid-column:1 / -1;grid-row:1}#panels{gap:3px;padding:3px}#selection{min-width:0}#result{display:none}#top{font-size:10px}#replay{top:4rem;max-width:65vw}#mode{max-width:90%;font-size:11px}#help{width:90vw}#stop-archive{bottom:25rem}#toast{bottom:25rem}.overlay{left:2%;width:96%;top:5%}}
#connection{position:fixed;z-index:20;top:0;left:0;right:0;padding:12px;background:#503518;color:#fff}#connection button{margin-left:10px}
#result{max-height:4.5rem;overflow:auto;pointer-events:auto}#replay{top:7.5rem}
</style></head><body>
<section id="lobby">
  <h1>Atemporal Strategy</h1>
  <p><a href="/guide/" id="guide-link" target="_blank">How to play / Unit reference</a></p>
  <p id="rules"></p>
  <div class="row">
    <label>Username <input id="username" maxlength="24" placeholder="your name"></label>
    <label>Color <input id="color" type="color" value="#4fc3f7"></label>
    <span id="team-wrap" style="display:none"><label>Team <select id="team"></select></label></span>
  </div>
  <ul id="roster"></ul>
  <div class="row">
    <button id="start" disabled>Start match</button>
    <button id="spectate">Spectate</button>
    <button id="release" style="display:none">Release slot</button>
    <span id="lobby-error"></span>
  </div>
  <p id="status" class="muted">Connecting…</p>
</section>
<section id="game">
  <canvas id="map" tabindex="0" aria-label="Battlefield"></canvas>
  <div id="top"><span id="top-phase"></span><span id="top-tick"></span><span id="top-bank"></span><span id="top-score"></span><span id="top-sim"></span><span id="top-exact"></span></div>
  <div id="mode"></div>
  <div id="result"></div>
  <div id="toast"></div>
  <div id="help"></div>
  <div id="panels">
    <div id="selection"><h3>Selection</h3><div id="selection-body" class="muted">Nothing selected. Click or drag on the map. Press ? for hotkeys.</div></div>
    <div id="timeline-wrap"><canvas id="timeline"></canvas><div id="transport"><button id="play">Play</button><button id="step-back">◀ 1</button><button id="step-fwd">1 ▶</button><button id="jump-back">◀ 100</button><button id="jump-fwd">100 ▶</button><span id="rate"></span><input id="tick-input" type="number" min="0" style="width:6rem"><button id="to-draft">Draft tick</button><span id="timeline-info" class="muted"></span></div></div>
    <div><canvas id="minimap"></canvas><div id="draft-panel"><h3 id="draft-title">Draft</h3><ul id="draft-list"></ul><button id="commit" disabled>Commit</button></div></div>
  </div>
</section>
<script type="module" src="/app.js"></script>
</body></html>
