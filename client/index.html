/* The battlefield has its own measured viewport above the command deck. */

#panels{grid-template-columns:minmax(240px,1fr) minmax(480px,2.4fr) minmax(240px,1fr);padding:8px;background:#0c131d;border-top:2px solid #354f68;gap:8px}

#outcome-banner[data-outcome=preview]{border-color:#5eead4;background:#153b3b;color:#a7fff1}
.selection-value{font-size:12px;padding:3px 0;color:#dce6ee}.selection-value[data-value="high"],.selection-value[data-value="mixed"]{color:#ffd36a}#cancel-blueprints{display:block;margin:5px 0;color:#ffb7ad;border-color:#b87367}
#graph{height:280px}#selection-body>small{display:block;margin-top:4px;color:var(--dim)}

#scoreboard{position:absolute;right:8px;top:4px;width:min(41vw,510px);color:#e7f0f6}
.scoreboard-heading{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:10px;letter-spacing:.06em;margin:0 2px 3px}.scoreboard-heading strong{color:#ffe49a}.scoreboard-heading span{color:#bed0dc;letter-spacing:0}
.scoreboard-players{display:flex;gap:5px}.score-player{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:0 6px;padding:4px 8px;background:#18232e;border:1px solid #3c4b59;border-top:3px solid var(--player-color);border-radius:5px}
.score-name{color:var(--player-color);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}.score-count{font-size:30px;line-height:1;grid-column:2;grid-row:1/3;font-variant-numeric:tabular-nums;color:var(--player-color)}.score-status{font-size:9px;color:#aabdc9;letter-spacing:.07em}.score-points{grid-column:1/-1;font-size:9px;color:#d3dde3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stock-label{font-size:11px;color:#9ce5dc}.missile-inventory>button{font-size:10px;padding:3px 5px}

<section id="lobby">

    <label>Username <input id="username" maxlength="24" placeholder="your name"></label>
