<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atemporal — An RTS from the perspective of God.</title>
<style>
:root{color-scheme:dark;--ink:#edf4fa;--muted:#a7b6c6;--accent:#86dcff}*{box-sizing:border-box}body{margin:0;background:#0e141c;color:var(--ink);font:17px/1.75 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:70px 32px 48px}header{padding:0 0 34px}h1{font-size:clamp(58px,8vw,96px);line-height:1.1;letter-spacing:-.06em;margin:0 0 18px;font-weight:600}.subtitle{font-size:clamp(19px,3vw,26px);color:var(--accent);margin:0}.description{padding:24px 0;color:var(--muted);max-width:72ch}.description p{margin:0 0 20px}.actions{display:grid;gap:12px;padding-top:30px}.button{display:flex;align-items:center;justify-content:space-between;min-height:70px;padding:17px 24px;border:1px solid #45637d;border-radius:8px;background:#182330;color:var(--ink);font:600 20px/1.4 system-ui;text-align:left;text-decoration:none;cursor:pointer}.button:hover{background:#26394b;border-color:var(--accent)}.primary{background:#246147;border-color:#4a9d77}.primary:hover{background:#2e7758}.button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.button:disabled{opacity:.7;cursor:wait}.arrow{font-size:26px;font-weight:400;color:var(--accent)}.primary .arrow{color:#c7f5db}#play-status{color:var(--muted);min-height:1.75em;margin:12px 0 0;font-size:15px}#resume{color:var(--accent)}[hidden]{display:none!important}dialog{background:#182330;color:var(--ink);border:1px solid #52718a;border-radius:12px;padding:28px;width:min(460px,94vw)}dialog::backdrop{background:#000b}dialog h2{margin:0 0 4px}dialog p{color:var(--muted);margin:0 0 14px}dialog input{width:100%;font:inherit;background:#0e1721;color:var(--ink);border:1px solid #496075;border-radius:5px;padding:8px;margin-bottom:14px}dialog .button{min-height:0;width:100%}@media(max-width:600px){main{padding:40px 22px 28px}.button{padding:16px 20px}.description{font-size:16px}}
</style></head><body><main>
<header><h1>Atemporal</h1><p class="subtitle">An RTS from the perspective of God.</p></header>
<section class="description" aria-label="About the game"><!-- GAME_DESCRIPTION --></section>
<nav class="actions" aria-label="Choose how to explore Atemporal">
<button class="button primary" id="play"><span>Play Against Bot</span><span class="arrow" aria-hidden="true">→</span></button>
<a class="button" href="/lobbies/"><span>View Lobby</span><span class="arrow" aria-hidden="true">↗</span></a>
<a class="button" href="/guide/"><span>Game Docs</span><span class="arrow" aria-hidden="true">↗</span></a>
</nav>
<p id="play-status" role="status" aria-live="polite"></p><a id="resume" hidden>Open your game</a>
<footer class="description" aria-label="A note from the creator"><!-- EXPERIMENT_NOTE --></footer>
<noscript><p>Enable JavaScript to play. You can still read Game Docs.</p></noscript>
</main>
<dialog id="name-dialog"><form method="dialog"><h2>What should we call you?</h2><p>Just a name to show who’s playing. No account or password needed.</p><input id="name-input" aria-label="Username" autocomplete="nickname" required><button class="button primary" value="ok"><span>Play</span><span class="arrow" aria-hidden="true">→</span></button></form></dialog>
<script type="module" src="/landing.js"></script></body></html>
