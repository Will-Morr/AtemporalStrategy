[workspace]
members = ["crates/contracts", "crates/content", "crates/tools", "crates/sim", "crates/server", "crates/runner"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
schemars = "=1.0.4"
sha2 = "=0.10.9"
serde_yaml = "=0.9.34"
atemporal-contracts = { path = "crates/contracts" }
atemporal-content = { path = "crates/content" }
